[project]
name = "dj-mcp"
version = "0.1.0"
description = "MCP server + FastAPI localhost app that turns Claude Code and GitHub Copilot into a DJ assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.0",
    "yt-dlp>=2024.8.6",
    "duckduckgo-search>=6.2",
    "pydub>=0.25",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26",
    "scipy>=1.13",
    "sqlmodel>=0.0.21",
    "websockets>=13.0",
]

[project.optional-dependencies]
boosters = ["demucs>=4.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["djmcp"]

[tool.pytest.ini_options]
markers = [
    "integration: hits real network services (YouTube, DuckDuckGo); excluded by default",
]
